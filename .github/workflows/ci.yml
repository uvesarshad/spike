name: CI

# One job, on a 3-OS matrix. It only exercises suites that are pure/
# in-memory (see scripts/run-tests.mjs's BROWSER_SUITES list and
# docs/infra/testing.md) — no real Chrome, no fixed ports, no external model
# credentials (A31 made this bucket genuinely Chrome-free: the one real-
# Chrome check that used to live in the fast bucket, v49's ensureChrome()
# concurrency dedupe, now lives in v49b.ensure-chrome.ts under
# BROWSER_SUITES). This is a genuine gate: it fails the build on a real
# regression in any fast-bucket suite, on Linux, macOS, and Windows.
#
# There is deliberately no CI job for the browser bucket (`npm run
# test:browser`). It needs a real branded Chrome, a pre-provisioned ~2GB
# Gemini Nano model (22GB free disk), and live model/agent credentials —
# none of which a stock GitHub-hosted runner has, and none of which this
# repo provisions on a self-hosted one. A prior version of this workflow had
# a `browser-suites` job gated on `workflow_dispatch`, but it still ran on
# `ubuntu-latest` with none of those prerequisites, so it would only ever
# fail — a phantom gate, not a real one. `npm run test:browser` is a LOCAL,
# pre-release manual gate only (see docs/infra/testing.md) — run it by hand
# on a dev machine with a real Chrome + Nano + credentials before a release,
# never expect it to run in this workflow.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: typecheck, build, fast tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # Extension zip: build it once (Linux leg only — pack-extension.ts is
      # cross-platform, but there's no reason to repeat the artifact upload
      # on all three OSes) and publish it as a downloadable build artifact
      # (A35b). See scripts/pack-extension.ts.
      - name: pack extension
        if: matrix.os == 'ubuntu-latest'
        run: npm run pack:extension
      - name: upload extension.zip artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: dist/extension.zip
          if-no-files-found: error
